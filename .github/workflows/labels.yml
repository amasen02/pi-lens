name: Sync labels

on:
  push:
    branches: [master]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [merge-train-post-merge]

concurrency:
  group: labels-${{ github.event.client_payload.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1
        with:
          manifest: .github/labels.yml
          token: ${{ secrets.GITHUB_TOKEN }}
